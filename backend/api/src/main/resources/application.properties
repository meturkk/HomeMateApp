spring.application.name=api

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/homemate_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration (Auto table creation)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=8080

# Spring Boot Multipart file upload configurations
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
